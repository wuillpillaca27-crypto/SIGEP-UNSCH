services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_DB: sigep_test
      POSTGRES_USER: sigep_test
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigep_test -d sigep_test"]
      interval: 5s
      timeout: 3s
      retries: 20
